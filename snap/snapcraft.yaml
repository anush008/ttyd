name: ttyd
adopt-info: ttyd
summary: Share your terminal over the web
description: |
 ttyd is a simple command-line tool for sharing terminal over the web

grade: stable
confinement: classic
base: core24
compression: lzo

license: MIT

assumes:
  - command-chain

apps:
  ttyd:
    command: usr/bin/ttyd
    command-chain: 
      - bin/homeishome-launch       

parts:
  ttyd:
    source: .
    plugin: cmake
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
    build-environment:
      - LDFLAGS: "-pthread"
      
    override-pull: |
      craftctl default
      craftctl set version="$(git describe --tags | sed 's/^v//' | cut -d "-" -f1)"
      
    build-packages:
      - build-essential 
      - libjson-c-dev
      - libuv1-dev
      - libwebsockets-dev
      
    stage-packages:
      - libjson-c5
      - libuv1t64
      - libwebsockets19t64
      
  homeishome-launch:
    plugin: nil
    stage-snaps:
      - homeishome-launch  
